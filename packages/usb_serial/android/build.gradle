// NEXUS IDE patch of usb_serial 0.5.2: jcenter() is gone in Gradle 9, and AGP 9 dropped the
// old DSL (compileSdkVersion, lintOptions) plus the per-plugin buildscript classpath.
group 'dev.bessems.usbserial'
version '1.0'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" } // felHR85/UsbSerial is only published there
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'dev.bessems.usbserial'
    compileSdk 36

    defaultConfig {
        minSdk 21
    }
    lint {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.felHR85:UsbSerial:6.1.0'
}
